<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#081a36">
<title>ロルカナ コレクション表</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#0b1020;color:#f5f7ff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Meiryo,sans-serif}
header{position:sticky;top:0;background:rgba(13,19,39,.97);color:#f5f7ff;border-bottom:1px solid #343d5b;padding:10px;z-index:5;backdrop-filter:blur(10px)}
h1{font-size:20px;margin:0 0 8px;letter-spacing:.02em} .row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.rarity{display:inline-flex;align-items:center;gap:6px;font-size:11px;line-height:1.25;font-weight:800;border:1px solid #69728c;border-radius:7px;padding:4px 7px;margin:0 4px 3px 0;color:#e8edf9;background:linear-gradient(135deg,#42495f,#171d31);box-shadow:inset 0 1px 0 #ffffff24,0 2px 5px #0003;letter-spacing:.01em}.rarity::before{content:"";display:inline-block;width:20px;height:20px;flex:0 0 20px;background:linear-gradient(145deg,#fff,#c6cee4 55%,#7b88a8);filter:drop-shadow(0 1px 2px #0008)}
.rarity.common{color:#e5e9f4;border-color:#8a91a6}.rarity.uncommon{color:#f0e6ff;border-color:#c3a5f6;background:linear-gradient(135deg,#61517d,#28203d)}.rarity.rare{color:#ffd49b;border-color:#cf8a42;background:linear-gradient(135deg,#8d4c21,#332015)}.rarity.super{color:#e1eaff;border-color:#b9c5e7;background:linear-gradient(135deg,#606b86,#252c40)}.rarity.legendary{color:#ffe58a;border-color:#e7bd42;background:linear-gradient(135deg,#8c6818,#33270c)}.rarity.epic{color:#f3dcff;border-color:#d77bff;background:linear-gradient(135deg,#7d36a4,#24123e)}.rarity.enchanted{color:#e6f7ff;border-color:#c4d7ed;background:linear-gradient(135deg,#8a9db8,#26364e)}.rarity.iconic{color:#fff0ff;border-color:#ff79d5;background:linear-gradient(135deg,#e88ac7,#3e64d5 55%,#44d6c2)}
.rarity.common::before{border-radius:50%;clip-path:circle(48%);background:linear-gradient(135deg,#fff,#9ba8c7)}.rarity.uncommon::before{clip-path:polygon(10% 0,90% 0,90% 55%,50% 100%,10% 55%);background:linear-gradient(135deg,#fff,#c7b6ff)}.rarity.rare::before{clip-path:polygon(50% 0,100% 100%,0 100%);background:linear-gradient(135deg,#ffd08b,#b76522)}.rarity.super::before{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);background:linear-gradient(135deg,#fff,#9caacb)}.rarity.legendary::before{clip-path:polygon(50% 0,97% 35%,79% 92%,21% 92%,3% 35%);background:linear-gradient(135deg,#fff3a6,#d59a17)}.rarity.epic::before{clip-path:polygon(0 72%,0 52%,3% 36%,9% 22%,19% 10%,32% 3%,43% 0,50% 0,57% 0,68% 3%,81% 10%,91% 22%,97% 36%,100% 52%,100% 72%,83% 80%,67% 88%,50% 100%,33% 88%,17% 80%);background-color:#ff8ee8;background-image:radial-gradient(circle at 25% 30%,#fff7b5 0 2px,transparent 2.5px),radial-gradient(circle at 65% 45%,#fff7b5 0 2px,transparent 2.5px),radial-gradient(circle at 45% 65%,#fff7b5 0 2px,transparent 2.5px),linear-gradient(135deg,#58dfff,#ffe7a0 42%,#ff83dc 72%,#b7a0ff)}.rarity.enchanted::before{clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);background:linear-gradient(135deg,#fff,#8c9cb8)}.rarity.iconic::before{clip-path:polygon(28% 0,72% 0,100% 28%,100% 72%,72% 100%,28% 100%,0 72%,0 28%);background:linear-gradient(135deg,#ffb8e8,#52d9ff 55%,#d9ff8b)}
.high-only #ownership{display:none}
input,button,select{font-size:15px;padding:9px;border:1px solid #4d5878;border-radius:8px;background:#171f36;color:#f5f7ff} input{min-width:0;flex:1} input::placeholder{color:#aeb8d0}
button{cursor:pointer} button:hover{filter:brightness(1.15)} .primary{background:linear-gradient(135deg,#176fc1,#5735a5);color:#fff;border:1px solid #628ee2;font-weight:800;box-shadow:0 3px 10px #0003}
#status{font-size:12px;color:#b8c2dc;margin-top:6px;min-height:16px}
#resetPasswordPanel{display:none;position:fixed;inset:0;z-index:50;background:#080d1bfa;padding:20px;align-items:center;justify-content:center}#resetPasswordPanel .reset-box{width:min(100%,420px);background:#202943;border:1px solid #596789;border-radius:16px;padding:20px;box-shadow:0 15px 50px #0009}#resetPasswordPanel h2{margin:0 0 12px;font-size:20px}#resetPasswordPanel input{width:100%;margin:7px 0;flex:none}#resetPasswordPanel button{margin-top:8px}
#filters{display:flex;gap:6px} #search{width:100%;margin-top:6px}
#cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:8px}
.card{background:linear-gradient(145deg,#202943,#11182a);border:1px solid #46516f;border-radius:11px;padding:9px;box-shadow:inset 0 1px 0 #ffffff12,0 4px 12px #0005;min-width:0;color:#f6f7ff}.card.owned{background:linear-gradient(145deg,#252b3b,#151b2a);border-color:#46516f;box-shadow:0 4px 12px #0005;opacity:.72}.card.not-owned{background:linear-gradient(145deg,#252c41,#111725);color:#f5f7ff}
.code{font-weight:850;font-size:14px;letter-spacing:.02em;color:#fff} .name{font-size:12px;min-height:28px;margin:5px 0;color:#e3e9fb}
.counts{display:flex;gap:12px;align-items:center;justify-content:center;margin-top:8px;font-weight:800}.count-chip{display:flex;gap:5px;align-items:center;font-size:13px;color:#d9e4ff}.count-chip b{font-size:18px;color:#fff}.count-chip .fnum{color:#ff7777}.edit-count{width:100%;margin-top:8px;background:linear-gradient(135deg,#e5edff,#b9c9f3);color:#142344;border-color:#9eb5ec;font-weight:800}
#inputScreen{position:fixed;inset:0;z-index:20;background:#080d1bfa;display:none;overflow:auto;padding: max(14px,env(safe-area-inset-top)) 14px max(18px,env(safe-area-inset-bottom))}.input-panel{max-width:440px;margin:0 auto;background:linear-gradient(145deg,#202943,#11182a);border:1px solid #596789;border-radius:18px;padding:16px;box-shadow:0 15px 50px #0009}.input-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.input-head h2{font-size:18px;margin:0}.input-name{color:#cbd5ee;font-size:13px;margin:7px 0 14px}.counter{display:grid;grid-template-columns:62px 52px 1fr 52px;gap:8px;align-items:center;margin:12px 0}.counter label{font-weight:900}.counter label.f{color:#ff7777}.counter button{font-size:24px;font-weight:900;padding:8px 0;min-height:48px}.counter .minus{background:#303a54}.counter .plus{background:#245c9a}.count-value{font-size:25px;text-align:center;background:#f6f8ff;color:#10172a;border-radius:9px;padding:9px 3px;font-weight:900;min-width:0}.count-value.active{outline:3px solid #69baff}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.keypad button{font-size:23px;font-weight:800;min-height:52px;background:#202b45}.keypad .utility{font-size:15px;background:#35415d}.input-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.input-actions button{flex:1;min-height:46px}.input-actions .nav-button{background:#303a54;color:#f5f7ff;border-color:#697796}.hint{font-size:11px;color:#aebbd8;margin-top:9px}.keyboard-hint{font-size:12px;color:#b9c8e8;margin-top:8px}.count-value{user-select:none}
@media(min-width:700px){#cards{grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;padding:10px}}
</style>
</head>
<body>
<header>
<h1>ロルカナ コレクション表</h1>
<div class="row"><button id="back">← 未取得カードへ戻る</button><button id="highButton" class="primary">高レア</button><span id="total" style="align-self:center;font-size:13px;color:#666"></span></div>
<div class="row">
<input id="email" type="email" placeholder="Supabase登録メール" autocomplete="username">
<input id="password" type="password" placeholder="パスワード" autocomplete="current-password">
<button class="primary" id="login">ログイン</button>
<button id="forgotPassword">パスワード再設定メール</button>
<button id="logout" style="display:none">ログアウト</button>
</div>
<div class="row"><select id="set"><option value="">すべてのJA</option></select><select id="ownership"><option value="all">すべて</option><option value="missing">未取得（N=0）</option><option value="owned">取得済み（N≥1）</option></select></div>
<input id="search" type="search" placeholder="カード番号・カード名で検索">
<div id="status">ログインするとPC・iPad間で枚数を共有できます。</div>
</header>
<div id="cards"></div>
<div id="resetPasswordPanel" role="dialog" aria-modal="true" aria-label="パスワード再設定">
 <div class="reset-box">
  <h2>新しいパスワードを設定</h2>
  <p style="font-size:13px;color:#cbd5ee">メールのリンクを開いたら、新しいパスワードを2回入力してください。</p>
  <input id="newPassword" type="password" autocomplete="new-password" placeholder="新しいパスワード（6文字以上）">
  <input id="confirmPassword" type="password" autocomplete="new-password" placeholder="新しいパスワード（確認）">
  <button id="updatePassword" class="primary" style="width:100%">パスワードを更新</button>
  <button id="cancelPasswordReset" style="width:100%">戻る</button>
  <div id="resetStatus" role="status" style="font-size:12px;color:#cbd5ee;margin-top:8px"></div>
 </div>
</div>
<div id="inputScreen" role="dialog" aria-modal="true" aria-label="枚数入力">
 <div class="input-panel">
  <div class="input-head"><h2>枚数入力</h2><button id="closeInput">閉じる</button></div>
  <div class="input-name" id="inputCardName"></div>
  <div class="counter"><label>N 通常</label><button class="minus" id="nMinus">−</button><div class="count-value active" id="nValue">0</div><button class="plus" id="nPlus">＋</button></div>
  <div class="counter"><label class="f">F フォイル</label><button class="minus" id="fMinus">−</button><div class="count-value" id="fValue">0</div><button class="plus" id="fPlus">＋</button></div>
  <div class="hint">数字を選んでテンキー入力、または＋・−で変更できます。変更内容は自動保存されます。</div>
  <div class="keypad" id="keypad"><button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button><button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button><button class="utility" data-key="clear">クリア</button><button data-key="0">0</button><button class="utility" data-key="back">⌫</button></div>
  <div class="keyboard-hint">PC：数字キーで入力／Backspaceで1桁削除／←→ボタンで前後のカードへ</div>
  <div class="input-actions"><button id="prevCard" class="nav-button">← 前のカード</button><button id="inputDone" class="primary">入力完了</button><button id="nextCard" class="nav-button">次のカード →</button></div>
 </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";
const SUPABASE_URL = "https://znmsbvbtcbtgzgtljxzc.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_yb9oh1nKNgb6uFeN_pPf2Q_kQksgoK6";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
 auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: "implicit" }
});
let user = null, cards = [], counts = new Map(), visibleCards = [];
const HIGH_RARITIES = new Set(["エピック", "エンチャンテッド", "アイコニック"]);
const highMode = new URLSearchParams(location.search).get("high") === "1";
const $ = id => document.getElementById(id);
function norm(v) { return String(v ?? "").normalize("NFKC").toLowerCase().replace(/[\s\-_]/g,""); }
function ja(code) { const m=String(code||"").toUpperCase().match(/^JA(\d+)(?:[-_]|$)/); return m ? "JA"+Number(m[1]) : ""; }
async function fetchJson(name) {
 const r=await fetch("./"+name+"?ts="+Date.now(),{cache:"no-store"});
 return r.ok ? await r.json() : null;
}
async function loadCards() {
 const d = await fetchJson("cardMaster.json");
 if (d === null) {
   throw new Error("cardMaster.json が見つかりません。collection.html と同じ場所にアップロードしてください。");
 }
 const source = Array.isArray(d) ? d : (Array.isArray(d.cards) ? d.cards : []);
 if (!source.length) throw new Error("cardMaster.json にカードデータがありません。");
 // カードマスタのカード番号・カード名をそのまま利用（画像は読み込みません）
 cards = source.filter(c => c && c.code).map(c => ({
   code: String(c.code).trim(),
   name: String(c.name || ""),
   version: String(c.version || ""),
   rarity: String(c.rarity || "")
 }));
 cards.sort((a,b)=>String(a.code).localeCompare(String(b.code), "ja", {numeric:true}));
 const sets=[...new Set(cards.map(c=>ja(c.code)).filter(Boolean))].sort((a,b)=>Number(a.slice(2))-Number(b.slice(2)));
 const select=$("set");
 select.querySelectorAll("option:not(:first-child)").forEach(o=>o.remove());
 for(const s of sets) { const o=document.createElement("option");o.value=s;o.textContent=s;select.appendChild(o); }
 if(highMode) { document.title="ロルカナ 高レア"; document.querySelector("h1").textContent="ロルカナ 高レア"; $("highButton").textContent="通常コレクション表"; $("ownership").style.display="none"; }
 render();
}
async function loadCounts() {
 if(!user) return;
 const {data,error}=await sb.from("lorcana_collection").select("card_code,normal_count,foil_count").eq("user_id",user.id);
 if(error) throw error;
 counts=new Map((data||[]).map(r=>[String(r.card_code),{n:Number(r.normal_count||0),f:Number(r.foil_count||0)}]));
 render();
}
function render() {
 const host=$("cards");host.innerHTML="";
 const kw=norm($("search").value), s=$("set").value, own=$("ownership").value;
 const filtered=cards.filter(c=>{
  const code=String(c.code||""), v=counts.get(code)||{n:Number(c.normal||0),f:Number(c.foil||0)};
  const isHigh = HIGH_RARITIES.has(c.rarity);
  return (highMode ? isHigh : !isHigh) && (!s||ja(code)===s) && (!kw||norm(code+" "+(c.name||"")+" "+(c.version||"")).includes(kw)) &&
   (highMode || own==="all"||(own==="missing"&&v.n<1)||(own==="owned"&&v.n>=1));
 });
 visibleCards=filtered;
 $("total").textContent=filtered.length+" / "+cards.length+"枚";
 const frag=document.createDocumentFragment();
 for(const c of filtered) {
  const code=String(c.code||""); const v=counts.get(code)||{n:Number(c.normal||0),f:Number(c.foil||0)};
  const card=document.createElement("article");card.className="card "+(v.n>=1?"owned":"not-owned");
  const cd=document.createElement("div");cd.className="code";cd.textContent=code;card.appendChild(cd);
  const rarityMark = document.createElement("span");
  const rarityMap = {
    "レア": ["R レア", "rare"],
    "スーパーレア": ["SR スーパーレア", "super"],
    "レジェンダリー": ["L レジェンダリー", "legendary"],
    "エピック": ["E エピック", "epic"],
    "エンチャンテッド": ["EN エンチャンテッド", "enchanted"],
    "アイコニック": ["IC アイコニック", "iconic"]
  };
  if(rarityMap[c.rarity]) { rarityMark.className="rarity "+rarityMap[c.rarity][1]; rarityMark.textContent=rarityMap[c.rarity][0]; card.appendChild(rarityMark); }
  const nm=document.createElement("div");nm.className="name";nm.textContent=(c.name||"")+(c.version?" / "+c.version:"");card.appendChild(nm);
  const countsRow=document.createElement("div");countsRow.className="counts";
  const nChip=document.createElement("div");nChip.className="count-chip";nChip.innerHTML='<span>N</span><b></b>';nChip.querySelector('b').textContent=v.n;
  const fChip=document.createElement("div");fChip.className="count-chip";fChip.innerHTML='<span class="count-f">F</span><b class="fnum"></b>';fChip.querySelector('b').textContent=v.f;
  countsRow.append(nChip,fChip);card.appendChild(countsRow);
  const edit=document.createElement("button");edit.className="edit-count";edit.textContent="枚数を入力";edit.disabled=false;
  edit.addEventListener("click",()=>openInput(c));
  card.appendChild(edit);frag.appendChild(card);
 }
 host.appendChild(frag);
}
let editingCard=null, editN=0, editF=0, activeCount="n", saveTimer=null, saveSequence=0;
function updateInputUI(){
 $("nValue").textContent=editN;$("fValue").textContent=editF;
 $("nValue").classList.toggle("active",activeCount==="n");$("fValue").classList.toggle("active",activeCount==="f");
}
function openInput(c){
 editingCard=c;
 if(!user){$("status").textContent="入力画面は開けます。PC・iPad共有の自動保存にはログインが必要です。";}const v=counts.get(c.code)||{n:0,f:0};editN=v.n;editF=v.f;activeCount="n";
 $("inputCardName").textContent=c.code+"　"+c.name+(c.version?" / "+c.version:"");updateInputUI();$("inputScreen").style.display="block";document.body.style.overflow="hidden";updateNavButtons();
}
function closeInput(){
 if(saveTimer){clearTimeout(saveTimer);saveTimer=null;saveEditedCounts();}
 $("inputScreen").style.display="none";document.body.style.overflow="";editingCard=null;
}
function updateNavButtons(){
 const i=editingCard?visibleCards.findIndex(c=>c.code===editingCard.code):-1;
 $("prevCard").disabled=i<=0;
 $("nextCard").disabled=i<0||i>=visibleCards.length-1;
 $("prevCard").style.opacity=$("prevCard").disabled?".4":"1";
 $("nextCard").style.opacity=$("nextCard").disabled?".4":"1";
}
async function moveCard(delta){
 if(!editingCard)return;
 const i=visibleCards.findIndex(c=>c.code===editingCard.code), next=visibleCards[i+delta];
 if(!next)return;
 if(saveTimer){clearTimeout(saveTimer);saveTimer=null;await saveEditedCounts();}
 openInput(next);
}
async function saveEditedCounts(){
 if(!user||!editingCard)return;
 const code=editingCard.code,n=editN,f=editF,seq=++saveSequence;
 counts.set(code,{n,f});render();
 $("status").textContent=code+" を自動保存中…";
 const row={user_id:user.id,card_code:code,normal_count:n,foil_count:f,updated_at:new Date().toISOString()};
 const {error}=await sb.from("lorcana_collection").upsert(row,{onConflict:"user_id,card_code"});
 if(seq!==saveSequence)return;
 if(error){$("status").textContent="自動保存失敗："+error.message;return;}
 $("status").textContent=code+" を自動保存しました。";
}
function changedCount(){updateInputUI();if(saveTimer)clearTimeout(saveTimer);saveTimer=setTimeout(saveEditedCounts,350);}
function changeCount(which,delta){if(which==="n")editN=Math.max(0,Math.min(999,editN+delta));else editF=Math.max(0,Math.min(999,editF+delta));activeCount=which;changedCount();}
$("nValue").addEventListener("click",()=>{activeCount="n";updateInputUI();});$("fValue").addEventListener("click",()=>{activeCount="f";updateInputUI();});
$("nMinus").addEventListener("click",()=>changeCount("n",-1));$("nPlus").addEventListener("click",()=>changeCount("n",1));$("fMinus").addEventListener("click",()=>changeCount("f",-1));$("fPlus").addEventListener("click",()=>changeCount("f",1));
$("keypad").addEventListener("click",e=>{const b=e.target.closest("button[data-key]");if(!b)return;let val=activeCount==="n"?String(editN):String(editF),key=b.dataset.key;if(key==="clear")val="0";else if(key==="back")val=val.length>1?val.slice(0,-1):"0";else val=(val==="0"?"":val)+key;val=String(Math.max(0,Math.min(999,parseInt(val,10)||0)));if(activeCount==="n")editN=Number(val);else editF=Number(val);changedCount();});
$("closeInput").addEventListener("click",closeInput);
$("prevCard").addEventListener("click",()=>moveCard(-1));
$("nextCard").addEventListener("click",()=>moveCard(1));
$("inputDone").addEventListener("click",()=>{if(saveTimer){clearTimeout(saveTimer);saveTimer=null;saveEditedCounts();}closeInput();});
document.addEventListener("keydown",e=>{
 if($("inputScreen").style.display!=="block"||!editingCard)return;
 if(e.ctrlKey||e.altKey||e.metaKey)return;
 if(/^[0-9]$/.test(e.key)){
  e.preventDefault();
  let val=activeCount==="n"?String(editN):String(editF);
  val=(val==="0"?"":val)+e.key;
  val=String(Math.max(0,Math.min(999,parseInt(val,10)||0)));
  if(activeCount==="n")editN=Number(val);else editF=Number(val);
  changedCount();
 }else if(e.key==="Backspace"){
  e.preventDefault();
  let val=activeCount==="n"?String(editN):String(editF);
  val=val.length>1?val.slice(0,-1):"0";
  if(activeCount==="n")editN=Number(val);else editF=Number(val);
  changedCount();
 }else if(e.key==="Delete"){
  e.preventDefault();
  if(activeCount==="n")editN=0;else editF=0;
  changedCount();
 }else if(e.key==="ArrowLeft"){
  e.preventDefault();moveCard(-1);
 }else if(e.key==="ArrowRight"){
  e.preventDefault();moveCard(1);
 }else if(e.key==="Tab"){
  e.preventDefault();
  activeCount=activeCount==="n"?"f":"n";updateInputUI();
 }
});

function authUI() {
 $("login").style.display=user?"none":"";
 $("logout").style.display=user?"":"none";
 $("email").style.display=user?"none":"";
 $("password").style.display=user?"none":"";
 if(user) $("status").textContent="ログイン中："+(user.email||"")+"（PC・iPad共通）";
}
$("login").addEventListener("click",async()=>{
 const email=$("email").value.trim(),password=$("password").value;
 if(!email||!password) {$("status").textContent="メールアドレスとパスワードを入力してください。";return;}
 $("status").textContent="ログイン中...";
 const {data,error}=await sb.auth.signInWithPassword({email,password});
 if(error) {$("status").textContent="ログイン失敗："+error.message;return;}
 user=data.user;authUI();render();
 try {await loadCounts();$("status").textContent="ログイン・共有データ読込完了";}
 catch(e) {$("status").textContent="データ読込失敗："+e.message;}
});
$("forgotPassword").addEventListener("click",async()=>{
 const email=$("email").value.trim();
 if(!email){$("status").textContent="先に登録メールアドレスを入力してください。";$("email").focus();return;}
 $("status").textContent="再設定メールを送信中…";
 const redirectTo=location.origin+location.pathname+"?reset=1";
 const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo});
 if(error){$("status").textContent="メール送信失敗："+error.message;return;}
 $("status").textContent="再設定メールを送信しました。メール内のリンクを開いてください。";
});
function showPasswordReset(){
 $("resetPasswordPanel").style.display="flex";
 setTimeout(()=>$("newPassword").focus(),0);
}
function checkPasswordRecoveryUrl(){
 const params=new URLSearchParams(location.search);
 const hashParams=new URLSearchParams(location.hash.replace(/^#/,""));
 if(params.get("reset")==="1" || hashParams.get("type")==="recovery") showPasswordReset();
 const authError=hashParams.get("error_description")||hashParams.get("error");
 if(authError){showPasswordReset();$("resetStatus").textContent="再設定リンクの認証に失敗しました。再設定メールをもう一度送信してください。";}
}
$("updatePassword").addEventListener("click",async()=>{
 const password=$("newPassword").value,confirm=$("confirmPassword").value;
 if(password.length<6){$("resetStatus").textContent="パスワードは6文字以上にしてください。";return;}
 if(password!==confirm){$("resetStatus").textContent="2つのパスワードが一致しません。";return;}
 $("updatePassword").disabled=true;
 try {
  $("resetStatus").textContent="認証状態を確認中…";
  const {data:sessionData,error:sessionError}=await sb.auth.getSession();
  if(sessionError) throw sessionError;
  if(!sessionData.session) throw new Error("再設定用の認証が確認できません。再設定メールの最新リンクを開き直してください。");
  $("resetStatus").textContent="パスワードを更新中…";
  const {error}=await sb.auth.updateUser({password});
  if(error) throw error;
  $("resetStatus").textContent="パスワードを更新しました。新しいパスワードでログインしてください。";
  $("password").value="";$("newPassword").value="";$("confirmPassword").value="";
  await sb.auth.signOut();user=null;authUI();
  setTimeout(()=>{$("resetPasswordPanel").style.display="none";history.replaceState({},document.title,location.pathname);$("status").textContent="パスワードを更新しました。新しいパスワードでログインしてください。";},1400);
 } catch(e) { $("resetStatus").textContent="更新失敗："+(e.message||String(e)); }
 finally { $("updatePassword").disabled=false; }
});
$("cancelPasswordReset").addEventListener("click",()=>{
 $("resetPasswordPanel").style.display="none";
 history.replaceState({},document.title,location.pathname);
});
sb.auth.onAuthStateChange((event,session)=>{
 if(event==="PASSWORD_RECOVERY") showPasswordReset();
 if(event==="SIGNED_IN" && session?.user){user=session.user;authUI();}
});
checkPasswordRecoveryUrl();
$("logout").addEventListener("click",async()=>{await sb.auth.signOut();user=null;counts=new Map();authUI();render();closeInput();$("status").textContent="ログアウトしました。";});
$("back").addEventListener("click",()=>location.href="./index.html");
$("highButton").addEventListener("click",()=>location.href=highMode?"./collection.html":"./collection.html?high=1");
$("search").addEventListener("input",render);$("set").addEventListener("change",render);$("ownership").addEventListener("change",render);
(async()=>{
 try {
  const {data}=await sb.auth.getSession();user=data.session?.user||null;authUI();
  await loadCards();
  if(user) await loadCounts();
 } catch(e) {$("status").textContent="読み込みエラー："+e.message;}
})();
</script>
</body>
