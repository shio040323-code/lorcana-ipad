<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#081a36">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>JAシリーズ一覧 - ロルカナ</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#f5f5f5;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Kaku Gothic ProN",Meiryo,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);padding:12px;border-bottom:1px solid #ddd}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
h1{font-size:19px;margin:0;flex:1}
a.back{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:6px 12px;border:1px solid #315f9e;border-radius:8px;background:#176fc1;color:#fff;text-decoration:none;font-size:13px;font-weight:700;white-space:nowrap}
#search{width:100%;height:42px;padding:0 12px;border:1px solid #ccc;border-radius:10px;background:#fff;font-size:16px}
#status{margin-top:7px;color:#777;font-size:12px;min-height:16px}
main{padding:10px}
#list{display:flex;flex-direction:column;gap:7px;max-width:900px;margin:0 auto}
.item{display:flex;align-items:center;gap:12px;min-height:58px;padding:10px 13px;background:#fff;border:1px solid #ddd;border-radius:9px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.code{flex:0 0 72px;color:#176fc1;font-weight:800;font-size:16px}
.title{min-width:0;font-size:14px;font-weight:700;overflow-wrap:anywhere}
.missing{color:#999;font-weight:400}
#empty{text-align:center;color:#777;padding:40px 12px;display:none}
@media(min-width:700px){main{padding:16px}.item{min-height:64px}.code{flex-basis:90px;font-size:17px}.title{font-size:15px}}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>JAシリーズ一覧</h1>
    <a class="back" href="./index.html">メイン画面へ戻る</a>
  </div>
  <input id="search" type="search" placeholder="JA番号・タイトルで検索" autocomplete="off">
  <div id="status">一覧データを読み込んでいます...</div>
</header>
<main>
  <div id="list"></div>
  <div id="empty">該当するシリーズがありません。</div>
</main>
<script>
"use strict";
const listEl=document.getElementById("list");
const searchEl=document.getElementById("search");
const statusEl=document.getElementById("status");
const emptyEl=document.getElementById("empty");
let series=[];
function normalize(value){
  return String(value??"").normalize("NFKC").toLowerCase().replace(/[\\s\\-_]/g,"");
}
function render(){
  const keyword=normalize(searchEl.value);
  const filtered=series.filter(item=>normalize(item.ja+" "+item.title).includes(keyword));
  listEl.replaceChildren();
  const fragment=document.createDocumentFragment();
  for(const item of filtered){
    const row=document.createElement("div");
    row.className="item";
    const code=document.createElement("div");
    code.className="code";
    code.textContent=item.ja;
    const title=document.createElement("div");
    title.className="title";
    if(item.title){
      title.textContent=item.title;
    }else{
      title.textContent="タイトル未登録";
      title.classList.add("missing");
    }
    row.append(code,title);
    fragment.appendChild(row);
  }
  listEl.appendChild(fragment);
  emptyEl.style.display=filtered.length?"none":"block";
  statusEl.textContent=`${filtered.length} / ${series.length}シリーズ`;
}
async function loadList(){
  try{
    const response=await fetch("./jaList.json",{cache:"no-cache"});
    if(!response.ok) throw new Error(`jaList.json の取得に失敗しました（HTTP ${response.status}）`);
    const data=await response.json();
    const rows=Array.isArray(data)?data:data.series;
    if(!Array.isArray(rows)) throw new Error("jaList.json は配列、または series 配列を含む形式にしてください");
    series=rows
      .filter(item=>item&&typeof item==="object"&&String(item.ja??"").trim())
      .map(item=>({ja:String(item.ja).trim().toUpperCase(),title:String(item.title??"").trim()}))
      .sort((a,b)=>Number((a.ja.match(/\\d+/)||[0])[0])-Number((b.ja.match(/\\d+/)||[0])[0]));
    render();
  }catch(error){
    statusEl.textContent=error.message;
    listEl.replaceChildren();
    emptyEl.style.display="block";
    emptyEl.textContent="一覧データを読み込めませんでした。jaList.json の配置を確認してください。";
    console.error(error);
  }
}
searchEl.addEventListener("input",render);
loadList();
</script>
</body>
</html>
